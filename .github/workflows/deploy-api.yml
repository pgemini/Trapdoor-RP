name: Deploy · api → Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  test_and_deploy:
    name: Smoke-test backend and trigger Render deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detector chain integrity
        working-directory: backend
        run: |
          python -c "from app.detectors import all_detectors; \
            ds=all_detectors(); print('detectors:', [d.name for d in ds]); \
            assert len(ds) == 10, f'expected 10 detectors, got {len(ds)}'"

      - name: Sample smoke test
        working-directory: backend
        # Two clean WAV samples are marked 'unexpected pass' in
        # heuristic-only mode (no transcription configured).  That's a
        # known fixture quirk; don't fail the deploy on it.
        continue-on-error: true
        run: python test_scan.py

      - name: Trigger Render deploy hook
        id: render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set"
            echo "Add the hook URL from Render → Service → Settings → Deploy Hook"
            exit 1
          fi
          status=$(curl -sS -o /tmp/render.json -w "%{http_code}" -X POST "$HOOK")
          echo "HTTP $status"
          cat /tmp/render.json || true
          # Render returns 201 Created when the deploy is queued.
          if [ "$status" -ge 400 ]; then
            echo "::error::Render deploy hook returned $status"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## API deploy — \`$GITHUB_SHA\`"
            echo
            echo "* commit: $(git log -1 --pretty='%s')"
            echo "* render trigger: ${{ steps.render.outcome }}"
            echo
            echo "Build progress is visible in the Render dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
