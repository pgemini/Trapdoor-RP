name: Deploy · api → Azure App Service

# Deploys the FastAPI backend (under backend/) to an Azure App Service
# Python Web App.  Triggers on every push to main that touches backend/**
# or on manual dispatch.
#
# Setup needed in the GitHub repo:
#   Settings → Secrets and variables → Actions
#   • Secrets:    AZUREAPPSERVICE_PUBLISHPROFILE    (Azure portal → Web App →
#                                                   Get publish profile → paste full XML)
#   • Variables:  AZURE_WEBAPP_NAME                 (the App Service name,
#                                                   e.g. "trapdoor-api")
#
# Setup needed in Azure:
#   • App Service runtime: Python 3.11
#   • Startup command:
#       gunicorn -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 app.main:app
#   • Application settings (env vars): AZURE_OPENAI_ENDPOINT,
#       AZURE_OPENAI_API_KEY, AZURE_WHISPER_DEPLOYMENT, ...
#       (see backend/.env.example for the full list)
#   • SCM_DO_BUILD_DURING_DEPLOYMENT = 1   (lets Oryx run pip install
#       against backend/requirements.txt on the server)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Test backend and deploy to App Service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (for pre-deploy tests)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detector chain integrity
        working-directory: backend
        run: |
          python -c "from app.detectors import all_detectors; \
            ds=all_detectors(); print('detectors:', [d.name for d in ds]); \
            assert len(ds) == 10, f'expected 10 detectors, got {len(ds)}'"

      - name: Sample smoke test
        working-directory: backend
        # Two clean WAVs are marked 'unexpected pass' in heuristic-only
        # mode (no transcription configured). Known fixture quirk.
        continue-on-error: true
        run: python test_scan.py

      - name: Sanity-check secrets are wired
        run: |
          if [ -z "${{ vars.AZURE_WEBAPP_NAME }}" ]; then
            echo "::error::Repository variable AZURE_WEBAPP_NAME is not set."
            echo "Set it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [ -z "${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}" ]; then
            echo "::error::Repository secret AZUREAPPSERVICE_PUBLISHPROFILE is not set."
            echo "Get it from: Azure portal → Web App → Overview → 'Get publish profile'."
            exit 1
          fi

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: production
          package: ./backend
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## API deploy — \`$GITHUB_SHA\`"
            echo
            echo "* commit: $(git log -1 --pretty='%s')"
            echo "* app:    \`${{ vars.AZURE_WEBAPP_NAME }}\`"
            echo "* status: ${{ steps.deploy.outcome }}"
            echo "* url:    ${{ steps.deploy.outputs.webapp-url || 'n/a' }}"
            echo
            echo "Once green, verify with:"
            echo "  curl https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/healthz"
          } >> "$GITHUB_STEP_SUMMARY"
