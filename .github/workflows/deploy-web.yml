name: Deploy · web → Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build static export and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npx tsc --noEmit -p .

      - name: Build static export
        working-directory: web
        env:
          TRAPDOOR_STATIC_EXPORT: "1"
          # NEXT_PUBLIC_API_BASE is the Render backend URL the frontend
          # calls.  Define it as a *repository variable* (not a secret —
          # it's public the moment the bundle ships).
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        id: swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web/out
          skip_app_build: true
          skip_api_build: true

      - name: Summary
        if: always()
        run: |
          {
            echo "## Web deploy — \`$GITHUB_SHA\`"
            echo
            echo "* commit: $(git log -1 --pretty='%s')"
            echo "* swa status: ${{ steps.swa.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
